<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Givio</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="icon" href="./assets/images/favicon/favicon-96x96.png" />
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  </head>
  <body>
    <header class="header-section">
      <!-- Header content omitted for brevity -->
    </header>

    <section class="contace-section section-lg-pb section-top-spacing">
      <div class="container">
        <div class="text-center mb-5">
          <h1 class="primary-title text-primary-gradient">Get In Touch</h1>
          <h4 class="title-sub-text">
            We’re here to help! Whether you have questions, need assistance, or want to share feedback.
          </h4>
        </div>

        <div class="contact-wrapper d-flex radius-xl flex-column-reverse flex-xl-row">
          <!-- Contact info -->
          <div class="contact-info-card bg-primary-gradient radius-lg">
            <div class="contact-info-card-wrapper z-1 d-flex flex-column">
              <h2 class="text-white fw-bold">Contact Information</h2>
              <h4 class="text-white-50 fw-normal">
                We're here to help! Contact us for questions or feedback.
              </h4>
              <div class="text-white mt-3">
                <p><strong>Customer Support:</strong> +1 (800) 123-4567</p>
                <p><strong>Email:</strong> support@givio.ai</p>
                <p><strong>Address:</strong> Givio HQ, 123 Gift Lane, NY 10001</p>
              </div>
            </div>
          </div>

          <!-- Contact form -->
          <div class="contact-form align-items-center d-flex">
            <form id="contactForm" class="d-flex flex-column w-100">
              <div class="row contact-form-wrapper justify-content-center">
                <div class="row gap-4">
                  <div class="col-12 col-sm-6 light-input input d-flex gap-3 align-items-center">
                    <input type="text" name="name" placeholder="Enter your name" required />
                  </div>
                  <div class="col light-input input d-flex gap-3 align-items-center">
                    <input type="email" name="email" placeholder="Enter your email" required />
                  </div>
                </div>

                <div class="row gap-4 mt-3">
                  <div class="col-12 col-sm-6 light-input input d-flex gap-3 align-items-center">
                    <input type="tel" name="phone" placeholder="Enter your phone number" />
                  </div>
                  <div class="col light-input input d-flex gap-3 align-items-center">
                    <input type="text" name="subject" placeholder="Enter your subject" />
                  </div>
                </div>

                <div class="row mt-3">
                  <textarea name="message" class="light-input textarea" placeholder="Enter your message" rows="5" required></textarea>
                </div>

                <div class="d-flex justify-content-center flex-column align-items-center gap-3 mt-3">
                  <div class="g-recaptcha" data-sitekey="6LeHG0orAAAAANCgfC75Eb6aQBDv8ebHLAdwyXxW"></div>
                  <button type="submit" class="custom-btn purple-gradient-btn">Submit</button>
                </div>

                <div id="formStatus" class="mt-3 text-center"></div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <footer class="bg-black-shade">
      <!-- Footer content omitted for brevity -->
    </footer>

    <!-- Scripts -->
    <script src="./assets/js/custom.js"></script>
    <script>
      document.getElementById('contactForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const status = document.getElementById('formStatus');
        status.textContent = 'Sending...';

        const token = grecaptcha.getResponse();
        if (!token) {
          status.textContent = 'Please complete the reCAPTCHA.';
          return;
        }

        const formData = new FormData(this);
        const body = {
          name: formData.get('name'),
          email: formData.get('email'),
          phone: formData.get('phone'),
          subject: formData.get('subject'),
          message: formData.get('message'),
          token: token,
        };

        try {
          const response = await fetch('https://278xkaq3y5.execute-api.eu-north-1.amazonaws.com/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });

          const result = await response.json();
          if (response.ok) {
            status.textContent = '✅ Message sent successfully!';
            document.getElementById('contactForm').reset();
            grecaptcha.reset();
          } else {
            status.textContent = `❌ Error: ${result.message || 'Something went wrong.'}`;
          }
        } catch (err) {
          status.textContent = '❌ Failed to send message.';
          console.error(err);
        }
      });
    </script>
  </body>
</html>
