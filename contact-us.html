<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Givio - Smart Gift Recommendations" />
    <meta
      name="description"
      content="Discover the perfect gift for any occasion with Givio, the smart gift recommendation platform."
    />
    <meta name="keywords" content="gift recommendations, smart gifting, curated gifts" />
    <meta name="author" content="Givio" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Givio - Smart Gift Recommendations" />
    <meta property="og:description" content="Personalized and effortless gifting made simple." />
    <meta property="og:type" content="website" />
    <title>Contact Us | Givio</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="icon" href="./assets/images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="manifest" href="./site.webmanifest" />
  </head>
  <body>
    <!-- HEADER OMITTED FOR BREVITY -->

    <section class="contace-section section-lg-pb section-top-spacing">
      <div class="container">
        <div class="text-start d-flex flex-column gap-4 section-md-mb align-items-center justify-content-center">
          <h1 class="primary-title text-start mb-0 text-primary-gradient">Get In Touch</h1>
          <h4 class="title-sub-text mb-0 text-center">
            We’re here to help! Whether you have questions, need assistance with your order, or just want to share feedback, feel free to reach out to us.
          </h4>
        </div>

        <div>
          <div class="contact-wrapper d-flex radius-xl flex-column-reverse flex-xl-row">
            <!-- Contact Info Card OMITTED -->

            <div class="contact-form align-items-center d-flex">
              <form class="d-flex flex-column w-100">
                <div class="row contact-form-wrapper justify-content-center">
                  <div class="row gap-4">
                    <div class="col-12 col-sm-6 light-input input d-flex gap-3 align-items-center">
                      <span class="flex-center text-black-shade" data-icon="iconUser"></span>
                      <input type="text" name="name" placeholder="Enter your name" required />
                    </div>
                    <div class="col light-input input d-flex gap-3 align-items-center">
                      <span class="flex-center text-black-shade" data-icon="iconMail"></span>
                      <input type="email" name="email" placeholder="Enter your email" required />
                    </div>
                  </div>

                  <div class="row gap-4 mt-3">
                    <div class="col-12 col-sm-6 light-input input d-flex gap-3 align-items-center">
                      <span class="flex-center text-black-shade" data-icon="iconCall"></span>
                      <input type="tel" name="phone" placeholder="Enter your phone number" />
                    </div>
                    <div class="col light-input input d-flex gap-3 align-items-center">
                      <span class="flex-center text-black-shade" data-icon="iconSubject"></span>
                      <input type="text" name="subject" placeholder="Enter your subject" />
                    </div>
                  </div>

                  <div class="row mt-3">
                    <textarea
                      class="light-input textarea"
                      name="message"
                      placeholder="Enter your message here"
                      rows="5"
                      required
                    ></textarea>
                  </div>

                  <div class="d-flex justify-content-center flex-column align-items-center gap-3 mt-3">
                    <div class="g-recaptcha" data-sitekey="6LeHG0orAAAAANCgfC75Eb6aQBDv8ebHLAdwyXxW"></div>
                    <button type="submit" class="custom-btn purple-gradient-btn">Submit</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- FOOTER OMITTED FOR BREVITY -->

    <!-- SCRIPTS -->
    <script src="./assets/js/swiper-bundle.min.js"></script>
    <script src="./assets/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/icons.js"></script>
    <script src="./assets/js/custom.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <script>
      document.querySelector('form').addEventListener('submit', function (e) {
        e.preventDefault();

        const form = e.target;

        grecaptcha.ready(function () {
          grecaptcha.execute('6LeHG0orAAAAANCgfC75Eb6aQBDv8ebHLAdwyXxW', { action: 'submit' }).then(async function (token) {
            const formData = {
              name: form.name.value,
              email: form.email.value,
              phone: form.phone.value,
              subject: form.subject.value,
              message: form.message.value,
              token: token
            };

            try {
              const response = await fetch("https://278xkaq3y5.execute-api.eu-north-1.amazonaws.com/contact", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
              });

              const result = await response.json();
              alert(result.message || "Message sent!");
              form.reset();
              grecaptcha.reset();
            } catch (err) {
              alert("An error occurred. Please try again later.");
            }
          });
        });
      });
    </script>
  </body>
</html>
